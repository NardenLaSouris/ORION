# ORION V3 : environnement de développement isolé du mini-PC (/opt/orion-v3, service orion-v3).
# Modèle installé par deploy/v3_env.sh ; voir docs/v3/environnements.md.
# Aucun secret de production, aucune donnée personnelle réelle : pas de mail, d'appel, de présence, de lumières,
# de Spotify ni d'agent de PC. Les adresses __PC__ et __KATANA__ sont remplacées à l'installation.

[llm]
# Modèles partagés, en lecture seule (aucune donnée personnelle) : worker du Katana, secours local.
host = "http://192.168.1.73:11434"
model = "huihui_ai/qwen3-abliterated:8b-v2"
think = "false"
fallback_host = "http://127.0.0.1:11434"
fallback_model = "qwen2.5:3b"
# Ollama est partagé avec la production : même durée de maintien en mémoire qu'elle, sinon chaque demande V3
# raccourcirait celle des modèles chargés et la production devrait les relire (jusqu'à 2 minutes sans GPU).
keep_alive = "-1m"
timeout = 20.0

[stt]
# Pas de transcription distante : le jeton du Katana est un secret de la production.
remote = ""

[audio]
mode = "none"

[mail]
enabled = false

[presence]
enabled = false

[call]
enabled = false

[lights]
enabled = false

[spotify]
enabled = false

# Aucun agent de PC (son jeton est un secret de la production) : les outils qui agissent sur un PC sont retirés,
# ils agiraient sinon sur le mini-PC lui-même.
[tools.open_url]
enabled = false

[tools.open_application]
enabled = false

[tools.close_application]
enabled = false

[tools.list_running_applications]
enabled = false

[tools.set_volume]
enabled = false

[tools.mute_volume]
enabled = false

[tools.unmute_volume]
enabled = false

[tools.lock_pc]
enabled = false

[tools.shutdown_pc]
enabled = false

[tools.media_play_pause]
enabled = false

[tools.media_next]
enabled = false

[tools.media_previous]
enabled = false

[api]
enabled = true
port = 8866
allowed_ips = ["__PC__", "__KATANA__"]

[face]
enabled = true
host = "0.0.0.0"
port = 8865
open_browser = false

[wallpaper]
enabled = true
port = 8867
allowed_ips = ["__PC__", "__KATANA__"]
actions = false
chat = true

[platform]
enabled = true
# Base personnelle chiffrée (lot F4). Clé : identifiant systemd orion-v3.data_key, jamais créée par l'installation ;
# sans elle, la base reste verrouillée et les textes personnels ne sont jamais écrits (docs/v3/foundation.md).
personal = true
data_key = "orion-v3.data_key"

