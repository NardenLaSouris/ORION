# Agent Windows V3 (docs/v3/discord.md) : distinct de l'agent de production (port 8765, jeton ORION_AGENT_TOKEN).
# Lancement sur le PC : powershell -File deploy\v3_agent.ps1 (depuis C:\Users\theju\orion-v3).
# Secrets hors du dépôt : %LOCALAPPDATA%\ORION V3 Agent\.env (ORION_V3_AGENT_TOKEN, DISCORD_CLIENT_ID,
# DISCORD_CLIENT_SECRET).

[agent]
host = "0.0.0.0"
port = 8875
allowed_ips = ["192.168.1.91"]   # le Core V3 (mini-PC) seulement
token_name = "ORION_V3_AGENT_TOKEN"
audio = false                    # aucun micro ni haut-parleur relayé : Discord seulement
pc_tools = false                 # aucune action sur le PC (applications, fichiers...)

[face]
open_on_connect = false

[discord]
enabled = true
redirect_uri = "http://localhost"   # à déclarer tel quel dans le Developer Portal (OAuth2 > Redirects)
data_dir = "~/AppData/Local/ORION V3 Agent"

# Frag Factory sur ce PC (docs/v3/fragfactory.md) : l'agent V3 relaie les demandes d'ORION V3 vers l'API locale de
# Frag Factory, en boucle locale. Jeton de liaison FRAGFACTORY_LINK_TOKEN dans le .env de l'agent V3 (le même
# qu'ORION_LINK_TOKEN de l'instance visée), jamais ici.
# Instance visée : l'instance d'ESSAI aux données fictives (port 8752, deploy/v3_fragfactory_essai.ps1). Votre vraie
# instance (port 8742) contient vos enregistrements et transcriptions : la viser est votre décision (url ci-dessous).
[fragfactory]
enabled = true
url = "http://127.0.0.1:8752"
timeout = 60.0
